name: Windows build and MSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build, test, and package (x64)
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64 -DRECALL_BUILD_REVISION=${{ github.run_number }}

      - name: Build Release
        run: cmake --build --preset release --parallel

      - name: Test C++ core, storage, previews, and appearance
        run: ctest --preset release

      - name: Test signing certificate selection
        run: ./tests/signing_tests.ps1

      - name: Test version increments
        run: ./tests/version_tests.ps1

      - name: Create unsigned MSIX
        run: ./tools/Package.ps1

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force out/artifacts | Out-Null
          Copy-Item out/build/Release/ReCall.exe, out/ReCall.msix, README.md, THIRD_PARTY_NOTICES.md out/artifacts/

      - name: Upload executable and unsigned package
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ReCall-windows-x64-unsigned
          path: out/artifacts/
          if-no-files-found: error
          retention-days: 3

      - name: Preserve unsigned release package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item out/ReCall.msix out/release/ReCall-windows-x64-unsigned.msix
          Copy-Item out/build/Release/ReCall.exe, README.md, THIRD_PARTY_NOTICES.md out/release/

      - name: Package and sign using the existing certificate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RECALL_SIGNING_PFX_BASE64: ${{ secrets.RECALL_SIGNING_PFX_BASE64 }}
          RECALL_SIGNING_PFX_PASSWORD: ${{ secrets.RECALL_SIGNING_PFX_PASSWORD }}
        run: |
          ./tools/Package-CI.ps1 -Executable ./out/build/Release/ReCall.exe
          Copy-Item out/ReCall.msix out/release/ReCall-windows-x64-signed.msix
          Copy-Item out/ReCall.Development.cer out/release/

      - name: Publish prerelease with commit details
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $version = (Get-Item out/build/Release/ReCall.exe).VersionInfo.FileVersion
          $commit = git log -1 --format=fuller $env:GITHUB_SHA | Out-String
          if ($LASTEXITCODE) { throw 'Could not read commit details.' }
          $notes = @(
            "Development build **$version** (Windows x64)."
            ''
            "Commit: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
            "Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ''
            '### Commit details'
            '<pre>'
            [System.Net.WebUtility]::HtmlEncode($commit.TrimEnd())
            '</pre>'
            ''
            '### Downloads'
            '- ReCall-windows-x64-signed.msix: signed installation package.'
            '- ReCall-windows-x64-unsigned.msix: package for your own signing.'
            '- ReCall.Development.cer: public certificate; import only if not already trusted.'
            '- ReCall.exe: portable executable.'
          ) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          # Publish only after every asset is uploaded; failures leave a draft.
          gh release create $tag --target $env:GITHUB_SHA --title "ReCall $version (development build)" --notes-file $notesPath --draft --prerelease
          if ($LASTEXITCODE) { throw 'Could not create draft release.' }
          $assets = @(Get-ChildItem out/release -File | ForEach-Object { $_.FullName })
          gh release upload $tag @assets
          if ($LASTEXITCODE) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit $tag --draft=false --prerelease --latest=false
          if ($LASTEXITCODE) { throw 'Could not publish release.' }
          "Release: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
